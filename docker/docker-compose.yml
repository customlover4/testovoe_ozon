services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ADDR: 0.0.0.0
      PORT: "8080"
      STORAGE: postgres
      POSTGRES_DSN: postgres://app:app@postgres:5432/comments?sslmode=disable
      SECRET: lkdksajhjg;io;hjb
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d comments"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  
