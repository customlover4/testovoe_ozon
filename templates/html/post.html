<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>
</head>
<body>
    <a href="/">main page</a>
    <hr>
    <a href="/create-post">create post</a>
    <hr>
    <h1>Feed</h1>
    [[ if .error ]]
        <p style="color: red">[[ .error ]]</p>
    [[ end ]]

    [[ range .Posts ]]
        <article>
            <h2><a href="/posts/[[ .ID ]]">[[ .Title ]]</a></h2>
            <p>[[ .Body ]]</p>
            <small>author: [[ .AuthorID ]]</small>
        </article>
    [[ else ]]
        <p>nothing.</p>
    [[ end ]]

    [[ if .Next ]]
        <a href="/feed?first=[[ .First ]]&after=[[ .Next ]]">next</a>
    [[ end ]]

</body>
</html>
